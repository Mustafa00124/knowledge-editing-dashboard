# Inherited from Qwen3-4B-Base: same depth (36 layers) and module naming
# (model.layers.N.mlp.down_proj), and tied embeddings, so every layer index and
# the model.embed_tokens unembedding carry over. Hidden size differs (2048 vs 2560)
# but appears nowhere here. The edit layers are not traced for this model; placeholders for now.
alg_name: "LoRA"
model_name: models/SmolLM3-3B-Base
device: 0

lora_type: "lora"
rank: 8
lora_alpha: 32
layers: []
kl_factor: 0
norm_constraint: false
lora_dropout: 0.1
target_modules: ["q_proj", "v_proj"]

num_steps: 50
batch_size: 20
max_length: 128
lr: 5e-3
weight_decay: 0.0

model_parallel: false

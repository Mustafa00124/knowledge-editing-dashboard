# Exact match for our downloaded model - adapted from
# external/EasyEdit/hparams/LoRA/gpt-j-6B.yaml, just pointing model_name
# at the local path. target_modules ["fc_in","fc_out"] is GPT-J's actual
# MLP module naming (GPTJMLP), kept exactly as upstream's own template for
# this same model.
#
# `lr` and `num_steps` below are placeholders - run_experiment.py always
# overrides them from its --lr/--num_steps CLI args.
alg_name: "LoRA"
model_name: models/GPT-J-6B
device: 0

lora_type: "adalora"
layers: []
num_steps: 50
batch_size: 20
max_length: 30
lr: 5e-3
weight_decay: 0
kl_factor: 0
rank: 8
lora_alpha: 32
lora_dropout: 0.1
norm_constraint: false
target_modules: ["fc_in", "fc_out"]
model_parallel: false

# Knowledge Neurons via EasyEdit (see knowledge_neurons.py). Values are
# EasyEdit's GPT-J config, the one closest to the original paper: 20
# integration steps. Its Qwen2.5 config uses steps: 1 and batch_size: 1,
# which reduces integrated gradients to a single gradient, so it is not used.
alg_name: "KN"
model_name: models/Qwen3-4B-Thinking-2507
device: 0
model_parallel: false

lr_scale: 1.0
n_toks: 10
refine: false
batch_size: 20
steps: 20
adaptive_threshold: 0.1
p: 0.4

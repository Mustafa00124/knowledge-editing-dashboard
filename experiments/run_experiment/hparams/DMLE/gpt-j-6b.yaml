# DMLE (arXiv:2604.08284) - see portability/dmle.py.
#
# Two MEMIT updates, one per layer group: a rule's formula and description
# into formula_description_layers, its worked instances into instance_layers.
# Layer groups: the paper's own causal tracing of GPT-J-6B (formula/description peak 2-4, instance 13-15).
#
# base_method memit; every field below instance_layers is
# hparams/MEMIT/gpt-j-6b.yaml copied unchanged (its `layers` is replaced per
# stage), so DMLE vs MEMIT isolates the per-form layer routing.
# Cost: covariance statistics are cached for both groups, so the first run
# on this model computes them for the instance layers too.

alg_name: DMLE
model_name: models/GPT-J-6B
device: 0
base_method: memit
formula_description_layers: [2, 3, 4]
instance_layers: [13, 14, 15]
stats_dir: experiments/run_experiment/data/stats
layers: [3, 4, 5, 6, 7, 8]
clamp_norm_factor: 0.75
layer_selection: all
fact_token: subject_last
v_num_grad_steps: 25
v_lr: 5e-1
v_loss_layer: 27
v_weight_decay: 0.5
kl_factor: 0.0625
mom2_adjustment: true
mom2_update_weight: 15000
rewrite_module_tmp: transformer.h.{}.mlp.fc_out
layer_module_tmp: transformer.h.{}
mlp_module_tmp: transformer.h.{}.mlp
attn_module_tmp: transformer.h.{}.attn
ln_f_module: transformer.ln_f
lm_head_module: lm_head
mom2_dataset: wikipedia
mom2_n_samples: 100000
mom2_dtype: float32
model_parallel: false

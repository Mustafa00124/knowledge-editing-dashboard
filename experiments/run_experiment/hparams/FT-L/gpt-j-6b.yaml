# FT-L: the FT settings for this model with objective_optimization "prompt_last",
# the ROME paper's constrained fine-tuning (target scored at the last prompt
# position). Copied from ../FT/gpt-j-6b.yaml (FT-M); tune it separately.
# Adapted from external/EasyEdit/hparams/FT/gpt-j-6B.yaml:
#   - model_name -> local GPT-J-6B path
#   - device -> 0 (upstream example used 1; every job here only ever sees
#     one GPU, as cuda:0)
#   - [FT original; this FT-L copy uses "prompt_last"] objective_optimization -> "target_new" (FT-M), matching qwen3-4b.yaml
#   - norm_constraint -> false, same reasoning
#
# `lr` and `num_steps` below are placeholders — run_experiment.py always
# overrides them from its --lr/--num_steps CLI args.

alg_name: "FT"
model_name: models/GPT-J-6B
device: 0

layers: [21]
num_steps: 25
lr: 5e-4
batch_size: 20
max_length: 40
weight_decay: 0
kl_factor: 0
# Paper FT baseline is constrained: weights stay inside a 5e-5 norm ball
# of the originals (kmeng01/memit hparams/FT/..._constr.json). Without
# it, long runs degenerate - ours emitted empty text from step 500.
norm_constraint: 5e-5
objective_optimization: "prompt_last"

rewrite_module_tmp: "transformer.h.{}.mlp.fc_out"
layer_module_tmp: "transformer.h.{}"
mlp_module_tmp: "transformer.h.{}.mlp"
attn_module_tmp: "transformer.h.{}.attn"
ln_f_module: "transformer.ln_f"
lm_head_module: "lm_head"
model_parallel: false

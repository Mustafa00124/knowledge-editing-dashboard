# FT-L: the FT settings for this model with objective_optimization "prompt_last",
# the ROME paper's constrained fine-tuning (target scored at the last prompt
# position). Copied from ../FT/mistral-7b-instruct-v0.1.yaml (FT-M); tune it separately.
# Inherited unchanged from Mistral-7B-v0.1: same module layout and depth
# (32 layers, hidden 4096, Llama-style model.layers.N.mlp.down_proj).
# The edit layers are not traced for this model; placeholders for now.
alg_name: "FT"
model_name: models/Mistral-7B-Instruct-v0.1
device: 0

layers: [21]
num_steps: 25
lr: 5e-4
batch_size: 20
max_length: 40
weight_decay: 0
kl_factor: 0
norm_constraint: 5e-5
objective_optimization: "prompt_last"

rewrite_module_tmp: "model.layers.{}.mlp.down_proj.weight"
layer_module_tmp: "model.layers.{}"
mlp_module_tmp: "model.layers.{}.mlp"
attn_module_tmp: "model.layers.{}.self_attn"
ln_f_module: "model.norm"
lm_head_module: "lm_head"
model_parallel: false

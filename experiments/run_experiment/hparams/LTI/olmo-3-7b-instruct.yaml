# LTI, Learn to Inference (ICLR 2025, arXiv:2410.07819) - see portability/lti.py.
#
# MEMIT with its target vector fitted to the unedited model reasoning with
# the new fact in context ("Imagine that <fact>").
#   - midlayers: the logit-lens constraint layer, about half depth as in
#     upstream's configs (GPT-J 15 of 28, LLaMA-2-7B 15 of 32): 15 here.
#   - mid_kl_factor / last_kl_factor / nll_factor: upstream's
#     MEMIT-LTI/llama-2-7b.json values, not tuned for this model.
# base_method memit; every field from v_num_grad_steps on is
# hparams/MEMIT/olmo-3-7b-instruct.yaml copied unchanged (kl_factor is unused: LTI
# replaces MEMIT's KL term with its own two).

alg_name: LTI
model_name: models/Olmo-3-7B-Instruct
device: 0
base_method: memit
midlayers: [15]
constr_pos: subject
mid_kl_factor: 0.0425
last_kl_factor: 0.0725
nll_factor: 0.125
context_template: "Imagine that {fact}\n"
stats_dir: experiments/run_experiment/data/stats
layers: [4, 5, 6, 7, 8]
clamp_norm_factor: 4
layer_selection: all
fact_token: subject_last
v_num_grad_steps: 25
v_lr: 5e-1
v_loss_layer: 31
v_weight_decay: 1e-3
kl_factor: 0.0625
mom2_adjustment: true
mom2_update_weight: 15000
rewrite_module_tmp: model.layers.{}.mlp.down_proj
layer_module_tmp: model.layers.{}
mlp_module_tmp: model.layers.{}.mlp
attn_module_tmp: model.layers.{}.self_attn
ln_f_module: model.norm
lm_head_module: lm_head
mom2_dataset: wikipedia
mom2_n_samples: 100000
mom2_dtype: float32
model_parallel: false

# Inherited verbatim from qwen3-4b.yaml, with only model_name changed.
# Same pretrain and identical architecture (Qwen3ForCausalLM, 36 layers,
# hidden 2560), so every layer index and module template stays valid.
# The weights differ, so the cached mom2 stats do not carry over and are
# recomputed on first use under models/Qwen3-4B-Base.
# SCR never touches model weights, so unlike FT/ROME's hparams there's no
# per-architecture layer/module tuning needed here - model_name/device are
# the only things that actually vary per model. See scr.py for what the
# other fields mean.
alg_name: "SCR"
model_name: models/Qwen3-4B-Base
device: 0
sentence_model_name: "all-MiniLM-L6-v2"
retrieval_k: 3
max_new_tokens: 40

# Swept by the SCR investigation; these values are the original behaviour
# (see scr.py's SCRHyperParams for what each one does).
min_similarity: null
kb_key: "statement"
latest_edit_wins: false
confirm: "each"
confirm_margin: 0.0
confirm_shots: 0
max_confirmed: 0
fact_order: "most_similar_first"
answer_template: "plain"
no_context_framing: "bare"

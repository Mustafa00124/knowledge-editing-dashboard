# Inherited unchanged from Olmo-3-7B-Base (itself inherited from Mistral-7B): same module layout and depth
# (32 layers, hidden 4096, Llama-style model.layers.N.mlp.down_proj).
# The edit layers are not traced for this model; placeholders for now.
alg_name: "SCR"
model_name: models/DeepSeek-R1-Distill-Llama-8B
device: 0
sentence_model_name: "all-MiniLM-L6-v2"
retrieval_k: 3
max_new_tokens: 40

# Swept by the SCR investigation; these values are the original behaviour
# (see scr.py's SCRHyperParams for what each one does).
min_similarity: null
kb_key: "statement"
latest_edit_wins: false
confirm: "each"
confirm_margin: 0.0
confirm_shots: 0
max_confirmed: 0
fact_order: "most_similar_first"
answer_template: "plain"
no_context_framing: "bare"

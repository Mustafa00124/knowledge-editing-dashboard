# Inherited from Llama-3.1-8B: LlamaForCausalLM with the same module naming and an
# untied lm_head, but 28 layers instead of 32, so v_loss_layer is 27 (the last layer).
# The edit layers are not traced for this model; placeholders for now.
alg_name: "SCR"
model_name: models/MAP-Neo-7B-Instruct
device: 0
sentence_model_name: "all-MiniLM-L6-v2"
retrieval_k: 3
max_new_tokens: 40

min_similarity: null
kb_key: "statement"
latest_edit_wins: false
confirm: "each"
confirm_margin: 0.0
confirm_shots: 0
max_confirmed: 0
fact_order: "most_similar_first"
answer_template: "plain"
no_context_framing: "bare"

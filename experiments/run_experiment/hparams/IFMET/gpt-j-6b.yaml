# IFMET (ICML 2025, arXiv:2410.06331) - see portability/ifmet.py.
#
# First edit: PMET as configured below (its `layers`, at the subject).
# Furtherance edit: PMET again on deep_layers, at the last token of two-hop
# prompts the model writes itself (n_support at most, verified by asking the
# model what each description refers to).
#   - deep_layers 16..20: the paper edits GPT-J's [16..20] of 28 layers; the same
#     relative depth for 28 layers. Not traced for this model.
#   - n_support 3: the paper uses 1 to 5 per edit.
# base_method pmet; every field from stats_dir on is hparams/PMET/gpt-j-6b.yaml
# copied unchanged. Cost: PMET's covariance statistics are cached for
# deep_layers as well on the first run.

alg_name: IFMET
model_name: models/GPT-J-6B
device: 0
base_method: pmet
deep_layers: [16, 17, 18, 19, 20]
n_support: 3
verify_support: true
support_temperature: 0.7
support_max_new_tokens: 16
seed: 0
stats_dir: experiments/run_experiment/data/stats
layers: [3, 4, 5, 6, 7, 8]
clamp_norm_factor: 0.75
layer_selection: all
fact_token: subject_last
v_num_grad_steps: 30
v_lr: 2e-1
v_loss_layer: 27
v_weight_decay: 0.5
kl_factor: 1
mom2_adjustment: true
mom2_update_weight: 15000
rewrite_module_tmp: transformer.h.{}.mlp.fc_out
rewrite_module_tmps: ['transformer.h.{}.mlp.fc_out']
layer_module_tmp: transformer.h.{}
mlp_module_tmp: transformer.h.{}.mlp.fc_out
attn_module_tmp: transformer.h.{}.attn.out_proj
ln_f_module: transformer.ln_f
lm_head_module: lm_head
mom2_dataset: wikipedia
mom2_n_samples: 100000
mom2_dtype: float32
model_parallel: false
nll_loss_factor: 1

# Inherited from Llama-3.1-8B: LlamaForCausalLM with the same module naming and an
# untied lm_head, but 28 layers instead of 32, so v_loss_layer is 27 (the last layer).
# The edit layers are not traced for this model; placeholders for now.
alg_name: "PMET"
model_name: models/MAP-Neo-7B-Instruct
stats_dir: experiments/run_experiment/data/stats
device: 0
layers: [4, 5, 6, 7, 8]
clamp_norm_factor: 4
layer_selection: "all"
fact_token: "subject_last"
v_num_grad_steps: 30
v_lr: 2e-1
v_loss_layer: 27
v_weight_decay: 1e-3
kl_factor: 1
mom2_adjustment: true
mom2_update_weight: 15000
rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
rewrite_module_tmps: ["model.layers.{}.mlp.down_proj"]
layer_module_tmp: "model.layers.{}"
mlp_module_tmp: "model.layers.{}.mlp.down_proj"
attn_module_tmp: "model.layers.{}.self_attn.o_proj"
ln_f_module: "model.norm"
lm_head_module: "lm_head"
mom2_dataset: "wikipedia"
mom2_n_samples: 100000
mom2_dtype: "float32"
model_parallel: false
nll_loss_factor: 1

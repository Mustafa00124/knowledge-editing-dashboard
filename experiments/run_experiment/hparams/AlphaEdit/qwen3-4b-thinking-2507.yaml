# Inherited verbatim from qwen3-4b.yaml, with only model_name changed.
# Same pretrain and identical architecture (Qwen3ForCausalLM, 36 layers,
# hidden 2560), so every layer index and module template stays valid.
# The weights differ, so the cached mom2 stats do not carry over and are
# recomputed on first use under models/Qwen3-4B-Thinking-2507.
# Adapted from external/EasyEdit/hparams/AlphaEdit/qwen2.5-7b.yaml - no
# Qwen3-4B AlphaEdit hparams shipped. Same v_loss_layer/layers adaptation
# as MEMIT/PMET's qwen3-4b.yaml (35 / [4,5,6,7,8]) and the same
# mom2_adjustment + P_loc first-run caching note as AlphaEdit's
# gpt-j-6b.yaml in this folder.
alg_name: "AlphaEdit"
model_name: models/Qwen3-4B-Thinking-2507
stats_dir: experiments/run_experiment/data/stats
# P is the null-space projection of THIS checkpoint's weights, so it must
# not share a cache file with the other Qwen3-4B variants - same
# architecture, different weights, different null space.
P_loc: experiments/run_experiment/data/stats/alphaedit_P_qwen3-4b-thinking-2507.pt
device: 0
layers: [4, 5, 6, 7, 8]
clamp_norm_factor: 4
layer_selection: "all"
fact_token: "subject_last"
v_num_grad_steps: 25
v_lr: 5e-1
v_loss_layer: 35
v_weight_decay: 1e-3
kl_factor: 0.0625
mom2_adjustment: true
mom2_update_weight: 15000
rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
layer_module_tmp: "model.layers.{}"
mlp_module_tmp: "model.layers.{}.mlp"
attn_module_tmp: "model.layers.{}.self_attn"
ln_f_module: "model.norm"
lm_head_module: "lm_head"
mom2_dataset: "wikipedia"
mom2_n_samples: 100000
mom2_dtype: "float32"
nullspace_threshold: 2e-2
L2: 1
model_parallel: false

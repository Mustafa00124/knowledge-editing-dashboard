# Exact match for our downloaded model - adapted from
# external/EasyEdit/hparams/AlphaEdit/gpt-j-6B.yaml, just pointing
# model_name/stats_dir/P_loc at local paths. P_loc (the null-space
# projection matrix) isn't precomputed yet on this system - upstream's own
# comment says it auto-computes and saves there if missing, so the first
# real run pays that cost once, same as the mom2 stats cache (see
# hparams/MEMIT/qwen3-4b.yaml for that note).
alg_name: "AlphaEdit"
model_name: models/GPT-J-6B
stats_dir: experiments/run_experiment/data/stats
P_loc: experiments/run_experiment/data/stats/alphaedit_P_gpt-j-6b.pt
device: 0
layers: [3, 4, 5, 6, 7, 8]
clamp_norm_factor: 0.75
layer_selection: "all"
fact_token: "subject_last"
v_num_grad_steps: 25
v_lr: 5e-1
v_loss_layer: 27
v_weight_decay: 0.5
kl_factor: 0.0625
mom2_adjustment: true
mom2_update_weight: 15000
rewrite_module_tmp: "transformer.h.{}.mlp.fc_out"
layer_module_tmp: "transformer.h.{}"
mlp_module_tmp: "transformer.h.{}.mlp"
attn_module_tmp: "transformer.h.{}.attn"
ln_f_module: "transformer.ln_f"
lm_head_module: "lm_head"
mom2_dataset: "wikipedia"
mom2_n_samples: 100000
mom2_dtype: "float32"
nullspace_threshold: 2e-2
L2: 10
model_parallel: false

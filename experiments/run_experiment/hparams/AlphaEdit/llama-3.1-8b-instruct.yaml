# Inherited unchanged from Olmo-3-7B-Base (itself inherited from Mistral-7B): same module layout and depth
# (32 layers, hidden 4096, Llama-style model.layers.N.mlp.down_proj).
# The edit layers are not traced for this model; placeholders for now.
alg_name: "AlphaEdit"
model_name: models/Llama-3.1-8B-Instruct
stats_dir: experiments/run_experiment/data/stats
P_loc: experiments/run_experiment/data/stats/alphaedit_P_llama-3.1-8b-instruct.pt
device: 0
layers: [4, 5, 6, 7, 8]
clamp_norm_factor: 4
layer_selection: "all"
fact_token: "subject_last"
v_num_grad_steps: 25
v_lr: 5e-1
v_loss_layer: 31
v_weight_decay: 1e-3
kl_factor: 0.0625
mom2_adjustment: true
mom2_update_weight: 15000
rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
layer_module_tmp: "model.layers.{}"
mlp_module_tmp: "model.layers.{}.mlp"
attn_module_tmp: "model.layers.{}.self_attn"
ln_f_module: "model.norm"
lm_head_module: "lm_head"
mom2_dataset: "wikipedia"
mom2_n_samples: 100000
mom2_dtype: "float32"
nullspace_threshold: 2e-2
L2: 1
model_parallel: false

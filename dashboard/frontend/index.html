<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowledge-Editing Dashboard</title>
    <script>
      // Applied before React mounts (and before any CSS-driven paint) so a
      // previously-picked theme doesn't flash to the default on reload.
      // ThemeSwitcher.jsx re-applies/persists this on every change.
      (function () {
        try {
          var theme = localStorage.getItem('dashboard_theme')
          if (theme) document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
